name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: portfolio-joao2/portfolio-joao/package-lock.json

      - name: Instalar dependencias
        working-directory: portfolio-joao2/portfolio-joao
        run: npm ci

      - name: Gerar versao de producao
        working-directory: portfolio-joao2/portfolio-joao
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: portfolio-joao2/portfolio-joao/dist

      - name: Publicar portfolio
        id: deployment
        uses: actions/deploy-pages@v4
